name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ⭐ Windows 是一級公民（規格表格 #7）。
    # termtosvg 只支援 Unix，svg-term-cli 的安裝說明也壞掉——這是差異化，不是附帶。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go build ./...
      # race 偵測器讓 5 萬事件的效能測試慢 6 倍以上（本機 5 s → runner 33 s），
      # 拿它量時間沒有意義。正確性用 -race + -short 跑全部；效能測試另外不帶 race 跑。
      - run: go test ./... -race -short -count=1
      - run: go test ./internal/render -run 'TestPerf' -count=1 -v
      - run: go vet ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下檔案未格式化："
            echo "$out"
            exit 1
          fi
