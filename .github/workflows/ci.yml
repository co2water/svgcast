name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ⭐ Windows 是一級公民（規格表格 #7）。
    # termtosvg 只支援 Unix，svg-term-cli 的安裝說明也壞掉——這是差異化，不是附帶。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: go build ./...
      - run: go test ./... -race -count=1
      - run: go vet ./...

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下檔案未格式化："
            echo "$out"
            exit 1
          fi
